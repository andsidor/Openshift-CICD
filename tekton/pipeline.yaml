apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: stock-api-pipeline
spec:
  params:
    - name: git-url
    - name: git-revision
      default: main
    - name: image
      default: image-registry.openshift-image-registry.svc:5000/asidor23-dev/stock-api:latest
  workspaces:
    - name: shared
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: git-clone}
          - {name: namespace, value: openshift-pipelines}
      workspaces:
        - {name: output, workspace: shared}
      params:
        - {name: URL, value: $(params.git-url)}
        - {name: REVISION, value: $(params.git-revision)}
    - name: test
      runAfter: [clone]
      workspaces:
        - {name: shared, workspace: shared}
      taskSpec:
        workspaces:
          - name: shared
        steps:
          - name: pytest
            image: registry.access.redhat.com/ubi9/python-311:latest
            workingDir: $(workspaces.shared.path)
            script: |
              pip install -r requirements.txt pytest
              python -m pytest -q
    - name: security-scan
      runAfter: [clone]
      workspaces:
        - {name: shared, workspace: shared}
      taskSpec:
        workspaces:
          - name: shared
        steps:
          - name: bandit-sast
            image: registry.access.redhat.com/ubi9/python-311:latest
            workingDir: $(workspaces.shared.path)
            script: |
              pip install bandit
              bandit -r app -ll
          - name: pip-audit-dependencies
            image: registry.access.redhat.com/ubi9/python-311:latest
            workingDir: $(workspaces.shared.path)
            script: |
              pip install pip-audit
              pip-audit -r requirements.txt
    - name: build
      runAfter: [test, security-scan]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: buildah}
          - {name: namespace, value: openshift-pipelines}
      workspaces:
        - {name: source, workspace: shared}
      params:
        - {name: IMAGE, value: $(params.image)}
    - name: image-scan
      runAfter: [build]
      taskSpec:
        steps:
          - name: trivy
            image: ghcr.io/aquasecurity/trivy:latest
            env:
              - {name: TRIVY_CACHE_DIR, value: /tmp/trivy}
              - {name: TRIVY_USERNAME, value: pipeline}
              - {name: TRIVY_INSECURE, value: "true"}
              - {name: TRIVY_NO_PROGRESS, value: "true"}
            script: |
              export TRIVY_PASSWORD="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              # krb5-libs: fix only in RHEL 9.9, not yet in UBI repos (accepted risk)
              printf '%s\n' CVE-2026-107364 CVE-2026-112315 CVE-2026-112316 CVE-2026-112317 CVE-2026-112318 CVE-2026-112319 CVE-2026-112320 CVE-2026-112321 CVE-2026-112322 CVE-2026-112323 CVE-2026-118380 CVE-2026-119079 CVE-2026-71199 CVE-2026-71200 > /tmp/.trivyignore
              trivy image --ignorefile /tmp/.trivyignore --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $(params.image)
    - name: tag-image
      runAfter: [image-scan]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: openshift-client}
          - {name: namespace, value: openshift-pipelines}
      params:
        - name: SCRIPT
          value: |
            oc tag stock-api:latest stock-api:$(tasks.clone.results.COMMIT)
    - name: deploy
      runAfter: [image-scan]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: openshift-client}
          - {name: namespace, value: openshift-pipelines}
      workspaces:
        - {name: manifest_dir, workspace: shared}
      params:
        - name: SCRIPT
          value: |
            oc apply -k k8s/ --prune -l gitops=managed --prune-allowlist=core/v1/ConfigMap --prune-allowlist=apps/v1/Deployment --prune-allowlist=core/v1/Service --prune-allowlist=route.openshift.io/v1/Route --prune-allowlist=image.openshift.io/v1/ImageStream
            oc rollout restart deployment/stock-api
            if ! oc rollout status deployment/stock-api --timeout=60s; then
              echo "Rollout failed - rolling back"
              oc rollout undo deployment/stock-api
              oc rollout status deployment/stock-api --timeout=120s
              exit 1
            fi
