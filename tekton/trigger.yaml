apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.head_commit.id)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: stock-api-template
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: stock-api-run-
      spec:
        pipelineRef:
          name: stock-api-pipeline
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - {name: git-url, value: $(tt.params.git-url)}
          - {name: git-revision, value: $(tt.params.git-revision)}
        workspaces:
          - name: shared
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-pr-binding
spec:
  params:
    - name: git-url
      value: $(body.pull_request.head.repo.clone_url)
    - name: git-revision
      value: $(body.pull_request.head.sha)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: stock-api-pr-template
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: stock-api-pr-run-
      spec:
        pipelineRef:
          name: stock-api-ci-pipeline
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - {name: git-url, value: $(tt.params.git-url)}
          - {name: git-revision, value: $(tt.params.git-revision)}
        workspaces:
          - name: shared
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-listener
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-pr
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value: [pull_request]
        - ref:
            name: cel
          params:
            - name: filter
              value: body.action in ['opened', 'synchronize', 'reopened']
      bindings:
        - ref: github-pr-binding
      template:
        ref: stock-api-pr-template
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value: [push]
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref == 'refs/heads/main'
      bindings:
        - ref: github-push-binding
      template:
        ref: stock-api-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: github-listener
spec:
  to:
    kind: Service
    name: el-github-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
